# nginx davanti al programma (SPEC sez. 6, PIANO sez. 1):
# risponde da solo per i file grafici e passa tutto il resto al container "app".
server {
    listen 80;
    server_name _;

    # file grafici (stile.css): letti da app/whoswho/static, montata in sola lettura
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1h;
    }

    # tutto il resto: il programma Python (Flask + waitress) sulla porta interna 8000
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
